<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Display</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111827'/%3E%3Cpath d='M7 10h18v12H7z' fill='%233b82f6'/%3E%3Cpath d='M11 14h10v4H11z' fill='white'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Video players - fill screen */
    #video-player,
    #youtube-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #video-player {
      object-fit: contain;
      background: #000;
    }

    #youtube-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Announcement overlay - covers everything during live stream */
    #announcement-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.98);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 100;
    }

    #announcement-overlay.active {
      display: flex;
    }

    #announcement-label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      color: white;
      padding: 8px 24px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 1rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    #announcement-video {
      max-width: 90%;
      max-height: 80%;
      border-radius: 8px;
      background: #111;
    }

    /* Status bar - top of screen */
    #status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #container:hover #status-bar {
      opacity: 1;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.online {
      background: #22c55e;
    }

    /* Idle screen - shown when no content */
    #idle-screen {
      text-align: center;
      z-index: 10;
    }

    #idle-screen h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      font-weight: 300;
    }

    #idle-screen p {
      font-size: 1.25rem;
      color: #94a3b8;
    }

    #idle-screen .logo {
      font-size: 5rem;
      margin-bottom: 2rem;
    }

    /* Broadcast text banner */
    #broadcast-banner {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #3b82f6;
      color: white;
      padding: 16px 40px;
      border-radius: 8px;
      font-size: 1.25rem;
      font-weight: 500;
      z-index: 75;
      display: none;
      max-width: 80%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
    }

    #broadcast-banner.show {
      display: block;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    /* Hide elements */
    .hidden {
      display: none !important;
    }

    /* Emergency Alert Overlay */
    #emergency-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 200;
      animation: emergencyPulse 1s infinite;
    }

    #emergency-overlay.active {
      display: flex;
    }

    @keyframes emergencyPulse {
      0%, 100% { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); }
      50% { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
    }

    #emergency-icon {
      font-size: 8rem;
      margin-bottom: 2rem;
      animation: shake 0.5s infinite;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    #emergency-title {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    #emergency-message {
      font-size: 2.5rem;
      font-weight: 600;
      text-align: center;
      max-width: 80%;
      line-height: 1.4;
    }

    #emergency-from {
      position: absolute;
      bottom: 30px;
      font-size: 1rem;
      opacity: 0.8;
    }

    /* Doubt Mode Overlay */
    #doubt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 40px;
    }

    #doubt-overlay.active {
      display: flex;
    }

    #doubt-status-badge {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #8b5cf6;
      color: white;
      padding: 10px 30px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 1.1rem;
      animation: doubtPulse 2s infinite;
    }

    @keyframes doubtPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
      50% { box-shadow: 0 0 0 15px rgba(139, 92, 246, 0); }
    }

    #doubt-speaker {
      font-size: 1.2rem;
      color: #a78bfa;
      margin-bottom: 10px;
    }

    #doubt-question {
      font-size: 2rem;
      font-weight: 600;
      text-align: center;
      max-width: 80%;
      margin-bottom: 30px;
      color: #fff;
      line-height: 1.4;
    }

    #doubt-answer-container {
      background: #1e1b4b;
      border-radius: 16px;
      padding: 30px 40px;
      max-width: 85%;
      max-height: 50vh;
      overflow-y: auto;
      border: 2px solid #4c1d95;
    }

    #doubt-answer-label {
      font-size: 0.9rem;
      color: #a78bfa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #doubt-answer {
      font-size: 1.5rem;
      line-height: 1.6;
      color: #e0e7ff;
    }

    #doubt-hint {
      position: absolute;
      bottom: 30px;
      font-size: 1rem;
      color: #94a3b8;
    }

    #doubt-hint span {
      color: #a78bfa;
      font-weight: 600;
    }

    /* Doubt waiting animation */
    .doubt-waiting {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
    }

    .doubt-waiting .dots {
      display: flex;
      gap: 5px;
    }

    .doubt-waiting .dot {
      width: 8px;
      height: 8px;
      background: #8b5cf6;
      border-radius: 50%;
      animation: dotBounce 1.4s infinite ease-in-out both;
    }

    .doubt-waiting .dot:nth-child(1) { animation-delay: -0.32s; }
    .doubt-waiting .dot:nth-child(2) { animation-delay: -0.16s; }
    .doubt-waiting .dot:nth-child(3) { animation-delay: 0; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- Status Bar (visible on hover) -->
    <div id="status-bar">
      <div class="status-indicator">
        <span class="status-dot" id="connection-dot"></span>
        <span id="connection-status">Connecting...</span>
      </div>
      <span id="classroom-name">Classroom</span>
      <span id="current-time"></span>
    </div>

    <!-- Idle Screen (shown when no video) -->
    <div id="idle-screen">
      <div class="logo">📺</div>
      <h1 id="display-name">Classroom Display</h1>
      <p>Waiting for content...</p>
    </div>

    <!-- HTML5 Video Player -->
    <video id="video-player" class="hidden" autoplay playsinline></video>

    <!-- YouTube Player Container -->
    <div id="youtube-container" class="hidden">
      <div id="youtube-player"></div>
    </div>

    <!-- Announcement Overlay (WebRTC live stream) -->
    <div id="announcement-overlay">
      <div id="announcement-label">LIVE ANNOUNCEMENT</div>
      <video id="announcement-video" autoplay playsinline></video>
    </div>

    <!-- Broadcast Text Banner -->
    <div id="broadcast-banner"></div>

    <!-- Emergency Alert Overlay -->
    <div id="emergency-overlay">
      <div id="emergency-icon">⚠️</div>
      <div id="emergency-title">EMERGENCY</div>
      <div id="emergency-message"></div>
      <div id="emergency-from"></div>
    </div>

    <!-- Doubt Mode Overlay -->
    <div id="doubt-overlay">
      <div id="doubt-status-badge">DOUBT MODE</div>
      <div id="doubt-speaker"></div>
      <div id="doubt-question"></div>
      <div id="doubt-answer-container">
        <div id="doubt-answer-label">AI Assistant</div>
        <div id="doubt-answer">
          <div class="doubt-waiting">
            <span>Waiting for your question</span>
            <div class="dots">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="doubt-hint">Say <span>"okay"</span> or <span>"understood"</span> to resume the video</div>
    </div>
  </div>

  <script>
    // =================== CONFIGURATION ===================

    const DEAD_REMOTE_HOSTS = new Set(['class-ai-backend.onrender.com']);

    function normalizeUrl(value) {
      if (!value || typeof value !== 'string') return null;
      try {
        return new URL(value).toString().replace(/\/$/, '');
      } catch {
        return null;
      }
    }

    function isLocalHost(hostname) {
      return hostname === 'localhost' || hostname === '127.0.0.1';
    }

    function resolveBackendUrl() {
      const currentUrl = new URL(window.location.href);
      const queryBackendUrl = normalizeUrl(currentUrl.searchParams.get('backend'));
      const configuredUrl =
        queryBackendUrl ||
        normalizeUrl(window.SUPERNODE_URL) ||
        normalizeUrl(sessionStorage.getItem('classroomBackendUrl')) ||
        normalizeUrl(localStorage.getItem('classroomBackendUrl'));
      const localBackendUrl = `${currentUrl.protocol}//${currentUrl.hostname}:5000`;

      if (configuredUrl) {
        const configuredHost = new URL(configuredUrl).hostname;
        if (isLocalHost(currentUrl.hostname)) {
          if (isLocalHost(configuredHost)) return configuredUrl;
          if (!DEAD_REMOTE_HOSTS.has(configuredHost)) return configuredUrl;
          return localBackendUrl;
        }
        sessionStorage.setItem('classroomBackendUrl', configuredUrl);
        localStorage.setItem('classroomBackendUrl', configuredUrl);
        return configuredUrl;
      }

      if (isLocalHost(currentUrl.hostname)) return localBackendUrl;
      if (currentUrl.port && currentUrl.port !== '5000') return localBackendUrl;
      const inferredUrl = currentUrl.origin.replace(/\/$/, '');
      sessionStorage.setItem('classroomBackendUrl', inferredUrl);
      localStorage.setItem('classroomBackendUrl', inferredUrl);
      return inferredUrl;
    }

    const SUPERNODE_URL = resolveBackendUrl();

    // Local Ollama configuration (runs on the classroom device)
    const OLLAMA_URL = window.OLLAMA_URL || 'http://localhost:11434';
    const OLLAMA_MODEL = window.OLLAMA_MODEL || 'phi';
    const OLLAMA_TIMEOUT = 30000; // 30 seconds

    // Get classroom name from URL params: ?name=Room101
    const urlParams = new URLSearchParams(window.location.search);
    const CLASSROOM_NAME = urlParams.get('name') || 'Classroom ' + Math.floor(Math.random() * 100);

    // Stable device ID — persists across doubt-page navigation for same room
    const _stableIdKey = `deviceId_${CLASSROOM_NAME}`;
    const DEVICE_ID = sessionStorage.getItem(_stableIdKey) || (() => {
      const id = `classroom-${CLASSROOM_NAME.toLowerCase().replace(/\s+/g, '-')}-${Date.now().toString(36)}`;
      sessionStorage.setItem(_stableIdKey, id);
      return id;
    })();

    // =================== STATE ===================

    let socket = null;
    let ytPlayer = null;
    let ytReady = false;
    let ytApiRequested = false;
    let ytApiFailed = false;
    let ytPendingVideoId = null;

    // Restore video state if returning from doubt page
    const _vidStateKey = `videoState_${CLASSROOM_NAME}`;
    const _restoredState = (() => {
      try { return JSON.parse(sessionStorage.getItem(_vidStateKey) || 'null'); } catch { return null; }
    })();
    let currentVideoUrl = _restoredState?.url || null;
    let currentVideoTime = _restoredState?.time || 0;
    let peerConnection = null;
    let announcementSessionId = null;

    // Camera streaming state
    let cameraStream = null;
    let cameraCanvas = null;
    let cameraContext = null;
    let cameraInterval = null;
    let isCameraStreaming = false;

    // Display/Screen streaming state
    let displayStream = null;
    let displayCanvas = null;
    let displayContext = null;
    let displayInterval = null;
    let isDisplayStreaming = false;

    // Doubt mode state
    let isInDoubtMode = false;
    let currentDoubtSpeaker = null;
    let videoContext = {
      title: null,
      topic: null,
      url: null,
    };

    // =================== DOM ELEMENTS ===================

    const connectionDot = document.getElementById('connection-dot');
    const connectionStatus = document.getElementById('connection-status');
    const classroomNameEl = document.getElementById('classroom-name');
    const displayNameEl = document.getElementById('display-name');
    const currentTimeEl = document.getElementById('current-time');
    const idleScreen = document.getElementById('idle-screen');
    const videoPlayer = document.getElementById('video-player');
    const youtubeContainer = document.getElementById('youtube-container');
    const announcementOverlay = document.getElementById('announcement-overlay');
    const announcementVideo = document.getElementById('announcement-video');
    const broadcastBanner = document.getElementById('broadcast-banner');
    const emergencyOverlay = document.getElementById('emergency-overlay');
    const emergencyMessage = document.getElementById('emergency-message');
    const emergencyFrom = document.getElementById('emergency-from');
    const doubtOverlay = document.getElementById('doubt-overlay');
    const doubtSpeaker = document.getElementById('doubt-speaker');
    const doubtQuestion = document.getElementById('doubt-question');
    const doubtAnswer = document.getElementById('doubt-answer');
    const doubtAnswerLabel = document.getElementById('doubt-answer-label');

    // =================== INITIALIZATION ===================

    // Set classroom name in UI
    classroomNameEl.textContent = CLASSROOM_NAME;
    displayNameEl.textContent = CLASSROOM_NAME;
    document.title = `${CLASSROOM_NAME} - Display`;

    // Update clock every second
    function updateTime() {
      const now = new Date();
      currentTimeEl.textContent = now.toLocaleTimeString();
    }
    updateTime();
    setInterval(updateTime, 1000);

    // =================== SOCKET.IO CONNECTION ===================

    function connectSocket() {
      console.log(`[Classroom] Connecting to ${SUPERNODE_URL}...`);

      if (typeof window.io !== 'function') {
        console.error('[Classroom] Socket.IO client did not load');
        connectionDot.classList.remove('online');
        connectionStatus.textContent = 'Socket client unavailable';
        showBroadcastBanner('Cannot load the Socket.IO client. Please verify the backend is reachable.');
        return;
      }

      socket = io(SUPERNODE_URL, {
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
      });

      // Connection established
      socket.on('connect', () => {
        console.log('[Classroom] Connected to Supernode');
        connectionDot.classList.add('online');
        connectionStatus.textContent = 'Connected';

        // Register as classroom device
        socket.emit('device:register', {
          deviceId: DEVICE_ID,
          type: 'classroom',
          name: CLASSROOM_NAME,
          capabilities: ['display', 'video', 'webrtc'],
        });
      });

      // Connection lost
      socket.on('disconnect', (reason) => {
        console.log('[Classroom] Disconnected:', reason);
        connectionDot.classList.remove('online');
        connectionStatus.textContent = 'Disconnected';
      });

      // Registration confirmed
      socket.on('device:registered', (data) => {
        if (data.success) {
          console.log('[Classroom] Registered successfully');

          // Start heartbeat to keep connection alive
          setInterval(() => {
            socket.emit('device:heartbeat', {
              deviceId: DEVICE_ID,
              status: 'healthy',
              metrics: {
                currentVideo: currentVideoUrl,
                isPlaying: !videoPlayer.paused || (ytPlayer && ytPlayer.getPlayerState?.() === 1),
              },
            });
          }, 30000);
        }
      });

      // =================== VIDEO CONTROL HANDLERS ===================

      socket.on('video:play', handleVideoPlay);
      socket.on('video:stop', handleVideoStop);

      // =================== ANNOUNCEMENT HANDLERS ===================

      socket.on('announcement:start', handleAnnouncementStart);
      socket.on('announcement:end', handleAnnouncementEnd);

      // =================== WEBRTC SIGNALING ===================

      socket.on('webrtc:offer', handleWebRTCOffer);
      socket.on('webrtc:ice-candidate', handleICECandidate);

      // =================== BROADCAST TEXT MESSAGES ===================

      socket.on('broadcast:message', handleBroadcastMessage);

      // =================== EMERGENCY ALERTS ===================

      socket.on('emergency:alert', handleEmergencyAlert);
      socket.on('emergency:stop', handleEmergencyStop);

      // =================== VIDEO PAUSE/RESUME (DOUBT MODE) ===================

      socket.on('video:pause', handleVideoPause);
      socket.on('video:resume', handleVideoResume);

      // =================== DOUBT MODE EVENTS ===================

      socket.on('doubt:mode-entered', handleDoubtModeEntered);
      socket.on('doubt:mode-exited', handleDoubtModeExited);
      socket.on('doubt:question', handleDoubtQuestion);
      socket.on('ai:response', handleAIResponse);

      // =================== CONTROL COMMANDS ===================

      socket.on('control:command', handleControlCommand);
    }

    // =================== VIDEO PLAYBACK ===================

    function handleVideoPlay(data) {
      console.log('[Classroom] Video play command:', data.url);
      const { url, autoPlay = true, volume = 1.0, title, topic } = data;

      currentVideoUrl = url;

      // Update video context for doubt resolution
      videoContext = {
        url: url,
        title: title || null,
        topic: topic || null,
      };

      // Detect if YouTube URL
      if (isYouTubeUrl(url)) {
        playYouTube(url, autoPlay);
      } else {
        playHTML5Video(url, autoPlay, volume);
      }

      // Acknowledge to server
      emitVideoState('playing', url);
    }

    function handleVideoStop(data) {
      console.log('[Classroom] Video stop command');
      stopAllVideos();
      currentVideoUrl = null;
      currentVideoTime = 0;
      showIdleScreen();
      emitVideoState('stopped');
    }

    // Check if URL is YouTube
    function isYouTubeUrl(url) {
      return url.includes('youtube.com') || url.includes('youtu.be');
    }

    // Extract YouTube video ID from various URL formats
    function extractYouTubeId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/watch\?.*v=([a-zA-Z0-9_-]{11})/,
      ];

      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    // Play YouTube video
    function playYouTube(url, autoPlay) {
      const videoId = extractYouTubeId(url);
      if (!videoId) {
        console.error('[Classroom] Invalid YouTube URL:', url);
        return;
      }

      hideAllPlayers();
      youtubeContainer.classList.remove('hidden');

      if (ytApiFailed) {
        showBroadcastBanner('YouTube playback is unavailable on this device right now.');
        return;
      }

      if (ytReady && ytPlayer && ytPlayer.loadVideoById) {
        // Player already initialized - load new video, seeking to saved time if any
        if (currentVideoTime > 0) {
          ytPlayer.loadVideoById({ videoId, startSeconds: currentVideoTime });
        } else {
          ytPlayer.loadVideoById(videoId);
        }
        if (autoPlay) ytPlayer.playVideo();
      } else {
        // Store video ID to play when player is ready
        ytPendingVideoId = videoId;

        // If YT API is loaded but player not created yet
        if (window.YT && window.YT.Player && !ytPlayer) {
          createYouTubePlayer(videoId, autoPlay);
        } else if (!ytApiRequested) {
          loadYouTubeApi();
        }
        // Otherwise, onYouTubeIframeAPIReady will handle it
      }
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing) {
          if (existing.dataset.loaded === 'true') {
            resolve();
            return;
          }
          existing.addEventListener('load', resolve, { once: true });
          existing.addEventListener('error', reject, { once: true });
          return;
        }

        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.addEventListener('load', () => {
          script.dataset.loaded = 'true';
          resolve();
        }, { once: true });
        script.addEventListener('error', reject, { once: true });
        document.head.appendChild(script);
      });
    }

    function loadSocketClient() {
      return loadScript(`${SUPERNODE_URL}/socket.io/socket.io.js`);
    }

    function showBroadcastBanner(message, duration = 5000) {
      if (!broadcastBanner) return;
      broadcastBanner.textContent = message;
      broadcastBanner.classList.add('show');
      window.setTimeout(() => {
        broadcastBanner.classList.remove('show');
      }, duration);
    }

    function loadYouTubeApi() {
      ytApiRequested = true;
      loadScript('https://www.youtube.com/iframe_api')
        .catch(() => {
          ytApiFailed = true;
          console.error('[Classroom] Failed to load YouTube IFrame API');
          showBroadcastBanner('YouTube playback is unavailable because the YouTube API could not be loaded.');
        });
    }

    // Create YouTube player instance
    function createYouTubePlayer(videoId, autoPlay) {
      ytPlayer = new YT.Player('youtube-player', {
        width: '100%',
        height: '100%',
        videoId: videoId,
        playerVars: {
          autoplay: autoPlay ? 1 : 0,
          controls: 0,           // Hide controls for clean display
          rel: 0,               // Don't show related videos
          modestbranding: 1,    // Minimal YouTube branding
          fs: 0,                // Disable fullscreen button
          iv_load_policy: 3,    // Hide annotations
          playsinline: 1,       // Play inline on mobile
        },
        events: {
          onReady: (event) => {
            ytReady = true;
            console.log('[Classroom] YouTube player ready');
            // Seek to saved position if returning from doubt page
            if (currentVideoTime > 0 && event.target.seekTo) {
              event.target.seekTo(currentVideoTime, true);
            }
            if (autoPlay) event.target.playVideo();
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              emitVideoState('ended');
            } else if (event.data === YT.PlayerState.PLAYING) {
              emitVideoState('playing');
            } else if (event.data === YT.PlayerState.PAUSED) {
              emitVideoState('paused');
            }
          },
          onError: (event) => {
            console.error('[Classroom] YouTube error:', event.data);
            emitVideoState('error');
          },
        },
      });
    }

    function handleAnnouncementStart(data) {

    // Create WebRTC peer connection (receive-only)
    function createPeerConnection() {
      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
        ],
      };

      peerConnection = new RTCPeerConnection(config);

      // Handle incoming media tracks
      peerConnection.ontrack = (event) => {
        console.log('[Classroom] Received media track:', event.track.kind);
        if (event.streams && event.streams[0]) {
          announcementVideo.srcObject = event.streams[0];
        }
      };

      // Send ICE candidates to server
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('webrtc:ice-candidate', {
            to: 'dashboard',
            candidate: event.candidate,
          });
        }
      };

      // Connection state logging
      peerConnection.onconnectionstatechange = () => {
        console.log('[Classroom] WebRTC connection state:', peerConnection.connectionState);
      };

      peerConnection.oniceconnectionstatechange = () => {
        console.log('[Classroom] ICE connection state:', peerConnection.iceConnectionState);
      };
    }

    // Handle WebRTC offer from dashboard
    async function handleWebRTCOffer(data) {
      console.log('[Classroom] Received WebRTC offer from:', data.from);

      if (!peerConnection) {
        createPeerConnection();
      }

      try {
        // Set remote description (the offer)
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));

        // Create and set local description (the answer)
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        // Send answer back to dashboard
        socket.emit('webrtc:answer', {
          to: data.from,
          sdp: answer,
        });

        console.log('[Classroom] Sent WebRTC answer');
      } catch (error) {
        console.error('[Classroom] WebRTC offer handling error:', error);
      }
    }

    function handleICECandidate(data) {
      if (peerConnection && data.candidate) {
        peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate))
          .catch(err => console.error('[Classroom] ICE candidate error:', err));
      }
    }

    // =================== LOCAL OLLAMA AI ===================

    // System prompt for doubt resolution
    const DOUBT_SYSTEM_PROMPT = `You are an AI Classroom Doubt Assistant integrated into a live classroom video system.

Your role is to answer student doubts based on the currently playing educational video.

Rules:
- Keep answers simple, clear, and classroom-friendly
- Use step-by-step explanations when needed
- Stay within the context of the video topic if provided
- Be concise - no emojis, no markdown formatting
- If the doubt is unclear, ask ONE short clarifying question only
- Do NOT introduce unrelated topics
- Speak like a teacher helping during a live class

If video context is provided, use it to give relevant answers.
If no context is available, answer the question to the best of your ability.`;

    // Query local Ollama for doubt resolution
    async function queryLocalOllama(question, context = {}) {
      const startTime = Date.now();

      // Build prompt with context
      let prompt = `SYSTEM: ${DOUBT_SYSTEM_PROMPT}\n\n`;

      // Add video context if available
      if (context.topic || context.title) {
        prompt += 'Video Context:\n';
        if (context.topic) prompt += `Current Topic: ${context.topic}\n`;
        if (context.title) prompt += `Video: ${context.title}\n`;
        prompt += '\n';
      }

      prompt += `USER: ${question}\n\nASSISTANT:`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), OLLAMA_TIMEOUT);

        const response = await fetch(`${OLLAMA_URL}/api/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: OLLAMA_MODEL,
            prompt: prompt,
            temperature: 0.4,
            stream: false,
          }),
          signal: controller.signal,
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`Ollama returned ${response.status}`);
        }

        const data = await response.json();
        const latencyMs = Date.now() - startTime;

        console.log(`[Classroom] Local Ollama response (${latencyMs}ms):`, data.response?.substring(0, 100));

        return {
          success: true,
          response: data.response || 'I could not generate a response.',
          source: 'local-ollama',
          latencyMs: latencyMs,
        };
      } catch (error) {
        const latencyMs = Date.now() - startTime;
        console.error('[Classroom] Local Ollama error:', error.message);

        if (error.name === 'AbortError') {
          return {
            success: false,
            response: 'The AI is taking too long to respond. Please try again.',
            source: 'local-ollama',
            latencyMs: latencyMs,
          };
        }

        return {
          success: false,
          response: `Could not connect to local AI. Please ensure Ollama is running. (${error.message})`,
          source: 'local-ollama',
          latencyMs: latencyMs,
        };
      }
    }

    // Log doubt session to dashboard via socket
    function logDoubtToDashboard(question, response, speaker, latencyMs, source) {
      if (socket && socket.connected) {
        socket.emit('ai:local-response', {
          deviceId: DEVICE_ID,
          question: question,
          response: response,
          speaker: speaker || 'Student',
          source: source,
          latencyMs: latencyMs,
          timestamp: new Date().toISOString(),
        });
      }
    }

    async function handleDoubtQuestion(data) {
      console.log('[Classroom] Doubt question:', data.question);

      const question = data.question;
      const speaker = data.speaker || currentDoubtSpeaker || 'Student';

      // Display the question
      doubtQuestion.textContent = `"${question}"`;

      // Update speaker if provided
      if (speaker) {
        doubtSpeaker.textContent = `Question from: ${speaker}`;
      }

      // Show loading state for answer
      doubtAnswer.innerHTML = `
        <div class="doubt-waiting">
          <span>Thinking</span>
          <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      `;

      // Try local Ollama first
      let result = await queryLocalOllama(question, videoContext);

      // If local Ollama failed, fall back to supernode
      if (!result.success) {
        console.log('[Classroom] Local Ollama failed, falling back to supernode...');
        doubtAnswer.innerHTML = `
          <div class="doubt-waiting">
            <span>Trying server AI</span>
            <div class="dots">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          </div>
        `;

        // Send to supernode and wait for response via socket
        if (socket && socket.connected) {
          socket.emit('ai:query', {
            deviceId: DEVICE_ID,
            queryId: Date.now().toString(),
            text: question,
            speaker: speaker,
            context: videoContext,
          });
          // Response will come via handleAIResponse
          return;
        } else {
          // No connection to supernode either
          result = {
            success: false,
            response: 'Cannot connect to AI. Please check your connection.',
            source: 'none',
            latencyMs: 0,
          };
        }
      }

      // Display the response (for local Ollama success or complete failure)
      if (doubtOverlay.classList.contains('active')) {
        doubtAnswer.textContent = result.response;

        // Update label to show source
        if (result.success) {
          doubtAnswerLabel.textContent = `AI Assistant (Local - ${result.latencyMs}ms)`;
        } else {
          doubtAnswerLabel.textContent = 'AI Assistant (Error)';
        }
      }

      // Log to dashboard for teacher visibility
      logDoubtToDashboard(question, result.response, speaker, result.latencyMs, result.source);
    }

    function handleAIResponse(data) {
      console.log('[Classroom] AI response from server:', data.response?.substring(0, 100));

      // This handles responses from the supernode (fallback or direct)
      // Update if in doubt mode - this covers the fallback case when local Ollama fails
      if (doubtOverlay.classList.contains('active')) {
        // Skip if this is our own local response being echoed back
        if (data.isLocal && data.fromDevice === DEVICE_ID) {
          return;
        }

        doubtAnswer.textContent = data.response || 'Sorry, I could not generate a response.';
        const sourceLabel = data.isLocal ? 'Local' : (data.source || 'Server');
        doubtAnswerLabel.textContent = `AI Assistant (${sourceLabel})`;
      }
    }

    // =================== CONTROL COMMANDS ===================

    function handleControlCommand(data) {
      const { action, params, commandId } = data;
      console.log('[Classroom] Control command:', action, params);

      let result = null;
      let error = null;

      try {
        switch (action) {
          case 'start-camera':
            startCameraStreaming();
            result = { camera: 'starting' };
            break;

          case 'stop-camera':
            stopCameraStreaming();
            result = { camera: 'stopped' };
            break;

          case 'start-display':
            startDisplayStreaming();
            result = { display: 'starting' };
            break;

          case 'stop-display':
            stopDisplayStreaming();
            result = { display: 'stopped' };
            break;

          case 'ping':
            result = { pong: true, timestamp: new Date().toISOString() };
            break;

          case 'status':
            result = {
              deviceId: DEVICE_ID,
              cameraStreaming: isCameraStreaming,
              displayStreaming: isDisplayStreaming,
              videoPlaying: currentVideoUrl ? true : false,
              currentVideo: currentVideoUrl,
            };
            break;

          default:
            result = { handled: false, action };
        }
      } catch (e) {
        error = e.message;
      }

      // Send acknowledgment
      socket.emit('control:ack', {
        commandId,
        success: error === null,
        error,
        result,
      });
    }

    // =================== CAMERA STREAMING ===================

    async function startCameraStreaming() {
      if (isCameraStreaming) {
        console.log('[Classroom] Camera already streaming');
        return;
      }

      try {
        // Request camera access
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: 'user'
          },
          audio: false
        });

        // Create canvas for frame capture
        cameraCanvas = document.createElement('canvas');
        cameraCanvas.width = 640;
        cameraCanvas.height = 480;
        cameraContext = cameraCanvas.getContext('2d');

        // Create video element to draw from
        const tempVideo = document.createElement('video');
        tempVideo.srcObject = cameraStream;
        tempVideo.play();

        isCameraStreaming = true;
        console.log('[Classroom] Camera started');

        // Stream frames every 100ms (10 FPS)
        cameraInterval = setInterval(() => {
          if (!isCameraStreaming || !cameraStream) {
            stopCameraStreaming();
            return;
          }

          // Draw current frame to canvas
          cameraContext.drawImage(tempVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);

          // Convert to JPEG base64
          const frameData = cameraCanvas.toDataURL('image/jpeg', 0.6);
          const base64Data = frameData.split(',')[1];

          // Send to server
          socket.emit('camera:frame', {
            deviceId: DEVICE_ID,
            frame: base64Data,
            timestamp: new Date().toISOString(),
          });
        }, 100);

      } catch (error) {
        console.error('[Classroom] Camera access denied:', error);
        isCameraStreaming = false;
      }
    }

    function stopCameraStreaming() {
      if (cameraInterval) {
        clearInterval(cameraInterval);
        cameraInterval = null;
      }

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      isCameraStreaming = false;
      console.log('[Classroom] Camera stopped');
    }

    // =================== DISPLAY/SCREEN STREAMING ===================

    async function startDisplayStreaming() {
      if (isDisplayStreaming) {
        console.log('[Classroom] Display already streaming');
        return;
      }

      try {
        // Request screen capture access
        displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            cursor: 'always',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        // Handle when user stops sharing via browser UI
        displayStream.getVideoTracks()[0].onended = () => {
          console.log('[Classroom] Display sharing stopped by user');
          stopDisplayStreaming();
        };

        // Create canvas for frame capture
        displayCanvas = document.createElement('canvas');
        displayCanvas.width = 1280;
        displayCanvas.height = 720;
        displayContext = displayCanvas.getContext('2d');

        // Create video element to draw from
        const tempVideo = document.createElement('video');
        tempVideo.srcObject = displayStream;
        await tempVideo.play();

        isDisplayStreaming = true;
        console.log('[Classroom] Display streaming started');

        // Stream frames every 1000ms (1 FPS for bandwidth)
        displayInterval = setInterval(() => {
          if (!isDisplayStreaming || !displayStream) {
            stopDisplayStreaming();
            return;
          }

          // Draw current frame to canvas
          displayContext.drawImage(tempVideo, 0, 0, displayCanvas.width, displayCanvas.height);

          // Convert to JPEG base64
          const frameData = displayCanvas.toDataURL('image/jpeg', 0.6);
          const base64Data = frameData.split(',')[1];

          // Send to server
          socket.emit('display:frame', {
            deviceId: DEVICE_ID,
            frame: base64Data,
            timestamp: new Date().toISOString(),
          });
        }, 1000);

      } catch (error) {
        console.error('[Classroom] Display access denied:', error);
        isDisplayStreaming = false;
      }
    }

    function stopDisplayStreaming() {
      if (displayInterval) {
        clearInterval(displayInterval);
        displayInterval = null;
      }

      if (displayStream) {
        displayStream.getTracks().forEach(track => track.stop());
        displayStream = null;
      }

      isDisplayStreaming = false;
      console.log('[Classroom] Display streaming stopped');
    }

    // =================== VOICE COMMANDS ===================

    function startVoiceCommands() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        console.warn('[Classroom] Speech recognition not supported');
        return;
      }

      const recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        console.log('[Classroom] Voice command heard:', transcript);

        if (transcript.includes('doubt')) {
          console.log('[Classroom] "Doubt" detected — navigating to DoubtCanvas');
          // Save current video position so we can resume after doubt is resolved
          const snapTime = videoPlayer.src && !videoPlayer.paused
            ? videoPlayer.currentTime
            : (ytPlayer?.getCurrentTime ? ytPlayer.getCurrentTime() : currentVideoTime);
          sessionStorage.setItem(_vidStateKey, JSON.stringify({
            url: currentVideoUrl,
            time: snapTime || currentVideoTime,
          }));
          window.location.href = `/?page=doubt&room=${encodeURIComponent(CLASSROOM_NAME)}`;
        }
      };

      recognition.onerror = (event) => {
        if (event.error !== 'no-speech') {
          console.warn('[Classroom] Voice recognition error:', event.error);
        }
      };

      // Keep recognition alive
      recognition.onend = () => {
        try { recognition.start(); } catch { /* ignore */ }
      };

      try {
        recognition.start();
        console.log('[Classroom] Voice commands active — say "Doubt" to open Doubt Canvas');
      } catch (e) {
        console.warn('[Classroom] Could not start voice commands:', e.message);
      }
    }

        console.error('[Classroom] Failed to load Socket.IO client:', error);
        connectionDot.classList.remove('online');
        connectionStatus.textContent = 'Backend unreachable';
        showBroadcastBanner(`Cannot reach backend at ${SUPERNODE_URL}`);
      });

    // Start voice command detection
    startVoiceCommands();

    // Resume video if returning from doubt page
    if (_restoredState?.url) {
      console.log('[Classroom] Resuming video from doubt break:', _restoredState.url, 'at', _restoredState.time);
      sessionStorage.removeItem(_vidStateKey); // consume it — don't re-restore on hard reload
      // Small delay to let socket and player initialise
      setTimeout(() => {
        handleVideoPlay({ url: _restoredState.url, autoPlay: true });
      }, 800);
    }

    // Log device info
    console.log('[Classroom] Device ID:', DEVICE_ID);
    console.log('[Classroom] Name:', CLASSROOM_NAME);
    console.log('[Classroom] Server:', SUPERNODE_URL);
  </script>
</body>
</html>
